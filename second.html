<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My First GitHub Page</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, sans-serif;
        }

        body{
            background:linear-gradient(135deg,#6dd5ed,#2193b0);
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
        }

        .card{
            background:white;
            width:420px;
            padding:40px;
            border-radius:15px;
            text-align:center;
            box-shadow:0 10px 25px rgba(0,0,0,0.2);
        }

        h1{
            color:#2193b0;
            margin-bottom:15px;
        }

        p{
            color:#555;
            line-height:1.6;
        }

        button{
            margin-top:25px;
            padding:12px 25px;
            border:none;
            border-radius:8px;
            background:#2193b0;
            color:white;
            font-size:16px;
            cursor:pointer;
        }

        button:hover{
            background:#176b87;
        }
    </style>
</head>
<body>

<div class="card">
    <h1>Hello 👋</h1>

    <p>
        This is my first webpage created after learning Git and GitHub.
    </p>

    <button onclick="alert('Welcome to my page!')">
        Click Me
    </button>
</div>

</body>
</html>
